<html manifest="slopkit.manifest">
<head>
<title>مِفتاح مكنون — Multi Fw · 11.50–14.02 · Cache</title>

<link rel="stylesheet" href="../style.css">
</head>
<body>
<header class="mk-head">
<img class="mk-mark" src="../brand/maknoon-mark.svg" alt="شعار مكنون">
<div class="mk-name">مِفتاح مكنون</div>
<div class="mk-sub">MULTI FW · 11.50–14.02 · CACHE</div>
</header>

<script>
history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);
function DLProgress(e){Percent=(Math.round(e.loaded / e.total * 100));window.msgs.innerHTML="تثبيت الحزمة المحلية: " + Percent + "%";}
function DisplayCacheProgress(){window.msgs.innerHTML="تم تثبيت الحزمة بنجاح ✔";setTimeout(function(){window.msgs.innerHTML="أغلق المتصفح الآن وأعد فتحه…";},1500);}
window.applicationCache.addEventListener("progress",DLProgress,false);
window.applicationCache.oncached=function(e){DisplayCacheProgress();};
window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
window.applicationCache.onerror=function(e){window.msgs.innerHTML="تعذّر تثبيت الحزمة — امسح بيانات المتصفح وأعد فتحه…";};
</script>
<hr>
<br>

</body>
